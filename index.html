<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Separação de Mercadorias - AP Frutas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy:#1F3864; --navy-dark:#16294a;
    --green:#27AE60; --yellow:#F5B700; --red:#E74C3C; --gray:#95A5A6; --blue:#5DADE2;
    --morango:#B03A2E; --brocolis:#556B2F; --couveflor:#0E7C7B; --alface:#2E8B57; --tomate:#D2691E;
  }
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:#eef1f5;margin:0 auto;padding:16px;color:#222;max-width:1100px}
  h1{font-size:20px;margin:16px 0 12px}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{padding:8px 14px;border:none;border-radius:6px;background:#fff;cursor:pointer;font-weight:bold;color:var(--navy)}
  .tabs button.active{background:var(--navy);color:#fff}
  .card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  label{font-size:13px;font-weight:bold;display:block;margin-bottom:4px}
  input,select{padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
  .row > div{flex:1;min-width:140px}
  button.action{background:var(--navy);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:bold}
  button.action.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  button.action.danger{background:var(--red)}
  table.list{width:100%;border-collapse:collapse;margin-top:0}
  table.list th,table.list td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
  .badge{padding:4px 8px;border-radius:4px;color:#fff;font-size:12px;font-weight:bold;display:inline-block}
  .toggle{cursor:pointer}
  .cat-banner{color:#fff;font-weight:bold;padding:8px 12px;border-radius:4px;margin:14px 0 0}
  .cat-group{margin-bottom:10px}

  /* ---- Área exportável (visual da planilha) — formato celular ---- */
  #exportArea{width:460px;background:#fff;font-family:Arial,Helvetica,sans-serif}
  .exp-title{background:var(--navy);color:#fff;text-align:center;font-size:17px;font-weight:bold;padding:12px}
  .exp-stripe{height:6px;display:flex}
  .exp-stripe div{flex:1}
  .exp-info{background:#4a76c9;color:#fff;display:flex;padding:8px 10px;align-items:center;gap:8px;font-size:12px}
  .exp-info .tipo{font-weight:bold;font-style:italic}
  .exp-info .data,.exp-info .hora{font-weight:bold;font-style:italic}
  .exp-info .data{margin-left:auto}
  .exp-cat{color:#fff;font-weight:bold;font-style:italic;font-size:15px;padding:8px 10px}
  .exp-head{display:flex;background:#555;color:#fff;font-weight:bold;font-style:italic;font-size:11px}
  .exp-head div,.exp-item div{padding:6px 4px;text-align:center}
  .exp-item{display:flex;background:#ddd;border-bottom:2px solid #fff;font-style:italic;font-size:11px;align-items:center}
  .exp-item .cliente{background:var(--navy);color:#fff;font-weight:bold;width:20%;word-break:break-word}
  .exp-item .produto{width:30%;text-align:left;word-break:break-word}
  .exp-item .status{width:30%}
  .exp-item .volume{width:20%;font-weight:bold}
  .exp-head .cliente{width:20%}.exp-head .produto{width:30%;text-align:left}
  .exp-head .status{width:30%}.exp-head .volume{width:20%}
  .exp-status{padding:4px 4px;border-radius:4px;color:#fff;font-weight:bold;width:94%;margin:0 auto;font-size:10px}
</style>
</head>
<body>

<h1>Separação de Mercadorias — AP Frutas</h1>

<div class="tabs">
  <button class="tab-btn active" data-tab="separacao">Separação do dia</button>
  <button class="tab-btn" data-tab="clientes">Cadastro de Clientes</button>
  <button class="tab-btn" data-tab="produtos">Cadastro de Produtos</button>
</div>

<!-- ===================== SEPARAÇÃO ===================== -->
<div id="tab-separacao" class="tab-content">
  <div class="card">
    <div class="row">
      <div>
        <label>Data</label>
        <input type="date" id="sepData">
      </div>
      <div>
        <label>Frutas / Verduras</label>
        <select id="sepTipo" onchange="atualizarCategoriasPorTipo()">
          <option value="Frutas">Frutas</option>
          <option value="Verduras">Verduras</option>
        </select>
      </div>
      <div style="flex:0 0 auto">
        <button class="action" onclick="abrirSeparacao()">Abrir / Criar</button>
      </div>
    </div>
  </div>

  <div class="card" id="itemFormCard" style="display:none">
    <h3>Adicionar item</h3>
    <div class="row">
      <div>
        <label>Categoria</label>
        <select id="itCategoria" onchange="filtrarProdutosPorCategoria()"></select>
      </div>
      <div>
        <label>Cliente</label>
        <select id="itCliente"></select>
      </div>
      <div>
        <label>Produto</label>
        <select id="itProduto"></select>
      </div>
      <div>
        <label>Status</label>
        <select id="itStatus" onchange="toggleVolume()">
          <option>Pedido Total</option>
          <option>Pedido Parcial</option>
          <option>Pedido Cancelado</option>
          <option>Sem Pedido</option>
          <option>Aguardar</option>
        </select>
      </div>
      <div id="volumeWrap">
        <label>Volume</label>
        <input type="number" id="itVolume" placeholder="0">
      </div>
      <div>
        <label>Unidade</label>
        <select id="itUnidade">
          <option value="cx">cx</option>
          <option value="unid">unid</option>
        </select>
      </div>
      <div style="flex:0 0 auto">
        <button class="action" onclick="adicionarItem()">Adicionar</button>
      </div>
    </div>
  </div>

  <div class="card" id="listaCard" style="display:none">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Itens desta separação</h3>
      <button class="action secondary" onclick="gerarImagem()">📷 Gerar imagem</button>
    </div>
    <div id="listaItens"></div>
  </div>
</div>

<!-- ===================== CLIENTES ===================== -->
<div id="tab-clientes" class="tab-content" style="display:none">
  <div class="card">
    <h3>Novo cliente</h3>
    <div class="row">
      <div><label>Nome</label><input id="novoClienteNome" placeholder="Ex: BENAFRUTI"></div>
      <div style="flex:0 0 auto"><button class="action" onclick="criarCliente()">Adicionar</button></div>
    </div>
  </div>
  <div class="card">
    <table class="list" id="tabelaClientes"><thead><tr><th>Nome</th><th>Ativo</th><th></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<!-- ===================== PRODUTOS ===================== -->
<div id="tab-produtos" class="tab-content" style="display:none">
  <div class="card">
    <h3>Novo produto</h3>
    <div class="row">
      <div><label>Nome</label><input id="novoProdutoNome" placeholder="Ex: Bandejão"></div>
      <div>
        <label>Categoria</label>
        <select id="novoProdutoCategoria">
          <option value="Morango">Morango</option>
          <option value="Brocolis">Brocolis</option>
          <option value="Couve-flor">Couve-flor</option>
          <option value="Alface">Alface</option>
          <option value="Tomate">Tomate</option>
        </select>
      </div>
      <div style="flex:0 0 auto"><button class="action" onclick="criarProduto()">Adicionar</button></div>
    </div>
  </div>
  <div class="card">
    <table class="list" id="tabelaProdutos"><thead><tr><th>Nome</th><th>Categoria</th><th>Ativo</th><th></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<!-- ===================== ÁREA DE EXPORTAÇÃO (fora da tela) ===================== -->
<div style="position:fixed;top:-10000px;left:-10000px">
  <div id="exportArea"></div>
</div>

<script>
// ---------- CONFIGURE AQUI ----------
const SUPABASE_URL = "https://cagorqpetzsgmttkvlcm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhZ29ycXBldHpzZ210dGt2bGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNzI3NDAsImV4cCI6MjA5OTg0ODc0MH0.2BIcQLPHxEVsGJK1tMoOGhFDu6Viu8X_HGNICl46cso";
// -------------------------------------
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_CORES = {
  "Pedido Total": "#27AE60",
  "Pedido Parcial": "#F5B700",
  "Pedido Cancelado": "#E74C3C",
  "Sem Pedido": "#95A5A6",
  "Aguardar": "#5DADE2"
};
const CAT_CORES = {
  "Morango": "#B03A2E",
  "Brocolis": "#556B2F",
  "Couve-flor": "#0E7C7B",
  "Alface": "#2E8B57",
  "Tomate": "#D2691E"
};
const CATEGORIAS_POR_TIPO = {
  "Frutas": ["Morango"],
  "Verduras": ["Brocolis","Couve-flor","Alface","Tomate"]
};

let clientes = [], produtos = [], separacaoAtual = null, itensAtuais = [];

// ---------- Navegação ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).style.display='block';
  });
});

async function carregarBase(){
  const {data:c} = await sb.from('clientes').select('*').order('nome');
  clientes = c || [];
  const {data:p} = await sb.from('produtos').select('*').order('categoria').order('ordem');
  produtos = p || [];
  renderClientes(); renderProdutos(); popularSelectClientes();
  atualizarCategoriasPorTipo();
}

// ---------- Clientes ----------
function renderClientes(){
  const tb = document.querySelector('#tabelaClientes tbody');
  tb.innerHTML = clientes.map(c=>`
    <tr>
      <td>${c.nome}</td>
      <td class="toggle" onclick="toggleClienteAtivo('${c.id}', ${c.ativo})">${c.ativo? '✅':'⛔'}</td>
      <td><button class="action secondary" onclick="renomearCliente('${c.id}','${c.nome.replace(/'/g,"\\'")}')">Editar</button></td>
    </tr>`).join('');
}
async function criarCliente(){
  const nome = document.getElementById('novoClienteNome').value.trim();
  if(!nome) return;
  await sb.from('clientes').insert({nome, ativo:true});
  document.getElementById('novoClienteNome').value='';
  carregarBase();
}
async function toggleClienteAtivo(id, ativo){
  await sb.from('clientes').update({ativo: !ativo}).eq('id', id);
  carregarBase();
}
async function renomearCliente(id, nomeAtual){
  const novo = prompt('Novo nome do cliente:', nomeAtual);
  if(novo && novo.trim()){
    await sb.from('clientes').update({nome: novo.trim()}).eq('id', id);
    carregarBase();
  }
}

// ---------- Produtos ----------
function renderProdutos(){
  const tb = document.querySelector('#tabelaProdutos tbody');
  tb.innerHTML = produtos.map(p=>`
    <tr>
      <td>${p.nome}</td>
      <td>${p.categoria||'-'}</td>
      <td class="toggle" onclick="toggleProdutoAtivo('${p.id}', ${p.ativo})">${p.ativo? '✅':'⛔'}</td>
      <td><button class="action secondary" onclick="renomearProduto('${p.id}','${(p.nome||'').replace(/'/g,"\\'")}')">Editar</button></td>
    </tr>`).join('');
}
async function criarProduto(){
  const nome = document.getElementById('novoProdutoNome').value.trim();
  const categoria = document.getElementById('novoProdutoCategoria').value;
  if(!nome) return;
  await sb.from('produtos').insert({nome, categoria, ativo:true, ordem:99});
  document.getElementById('novoProdutoNome').value='';
  carregarBase();
}
async function toggleProdutoAtivo(id, ativo){
  await sb.from('produtos').update({ativo: !ativo}).eq('id', id);
  carregarBase();
}
async function renomearProduto(id, nomeAtual){
  const novo = prompt('Novo nome do produto:', nomeAtual);
  if(novo && novo.trim()){
    await sb.from('produtos').update({nome: novo.trim()}).eq('id', id);
    carregarBase();
  }
}

// ---------- Separação do dia ----------
function popularSelectClientes(){
  document.getElementById('itCliente').innerHTML = clientes.filter(c=>c.ativo).map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
}
function atualizarCategoriasPorTipo(){
  const tipo = document.getElementById('sepTipo').value;
  const cats = CATEGORIAS_POR_TIPO[tipo];
  document.getElementById('itCategoria').innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  filtrarProdutosPorCategoria();
}
function filtrarProdutosPorCategoria(){
  const cat = document.getElementById('itCategoria').value;
  document.getElementById('itProduto').innerHTML = produtos.filter(p=>p.ativo && p.categoria===cat).map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');
}
function toggleVolume(){
  const s = document.getElementById('itStatus').value;
  document.getElementById('volumeWrap').style.display = (s==='Pedido Parcial') ? 'block':'none';
}

async function abrirSeparacao(){
  const data = document.getElementById('sepData').value;
  const tipo = document.getElementById('sepTipo').value;
  if(!data){ alert('Preencha a data.'); return; }

  let {data:existentes} = await sb.from('separacoes').select('*').eq('data', data).eq('tipo', tipo);
  if(existentes && existentes.length){
    separacaoAtual = existentes[0];
  } else {
    const {data:nova} = await sb.from('separacoes').insert({data, tipo}).select().single();
    separacaoAtual = nova;
  }
  document.getElementById('itemFormCard').style.display='block';
  document.getElementById('listaCard').style.display='block';
  toggleVolume();
  await carregarItens();
}

async function carregarItens(){
  const {data} = await sb.from('separacao_itens')
    .select('*, clientes(nome), produtos(nome, categoria)')
    .eq('separacao_id', separacaoAtual.id)
    .order('ordem');
  itensAtuais = data || [];
  renderItens();
}

async function adicionarItem(){
  const cliente_id = document.getElementById('itCliente').value;
  const produto_id = document.getElementById('itProduto').value;
  const status = document.getElementById('itStatus').value;
  const volume = document.getElementById('itVolume').value || null;
  const unidade = document.getElementById('itUnidade').value;
  if(!cliente_id || !produto_id){ alert('Selecione cliente e produto.'); return; }
  await sb.from('separacao_itens').insert({
    separacao_id: separacaoAtual.id, cliente_id, produto_id, status,
    volume: status==='Pedido Parcial' ? volume : null,
    unidade: status==='Pedido Parcial' ? unidade : null,
    ordem: itensAtuais.length
  });
  document.getElementById('itVolume').value='';
  await carregarItens();
}

async function removerItem(id){
  await sb.from('separacao_itens').delete().eq('id', id);
  await carregarItens();
}

function renderItens(){
  const wrap = document.getElementById('listaItens');
  if(!itensAtuais.length){ wrap.innerHTML = '<p>Nenhum item ainda.</p>'; return; }

  const categorias = [...new Set(itensAtuais.map(i=>i.produtos?.categoria))];
  wrap.innerHTML = categorias.map(cat=>{
    const itensCat = itensAtuais.filter(i=>i.produtos?.categoria===cat);
    const linhas = itensCat.map(it=>`
      <tr>
        <td>${it.clientes?.nome||''}</td>
        <td>${it.produtos?.nome||''}</td>
        <td><span class="badge" style="background:${STATUS_CORES[it.status]}">${it.status}</span></td>
        <td>${it.volume ? it.volume+' '+(it.unidade||'') : ''}</td>
        <td><button class="action danger" onclick="removerItem('${it.id}')">Excluir</button></td>
      </tr>`).join('');
    return `
      <div class="cat-group">
        <div class="cat-banner" style="background:${CAT_CORES[cat]||'#333'}">${cat}</div>
        <table class="list">
          <thead><tr><th>Cliente</th><th>Produto</th><th>Status</th><th>Volume</th><th></th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }).join('');
}

// ---------- Geração de imagem ----------
function agora(){
  const d = new Date();
  return {data: d.toLocaleDateString('pt-BR'), hora: d.toLocaleTimeString('pt-BR')};
}

async function gerarImagem(){
  if(!itensAtuais.length){ alert('Adicione itens antes de gerar a imagem.'); return; }
  const {hora} = agora();
  const categoriasPresentes = [...new Set(itensAtuais.map(i=>i.produtos?.categoria))];

  let html = `
    <div class="exp-title">SEPARAÇÃO DE MERCADORIAS</div>
    <div class="exp-stripe"><div style="background:#27AE60"></div><div style="background:#F5B700"></div><div style="background:#E74C3C"></div></div>
    <div class="exp-info">
      <div><b>AP</b><br>FRUTAS•VERDURAS</div>
      <div class="tipo">Separação ${separacaoAtual.tipo}</div>
      <div class="data">${new Date(separacaoAtual.data+'T00:00:00').toLocaleDateString('pt-BR')}</div>
      <div class="hora">${hora}</div>
    </div>`;

  categoriasPresentes.forEach(cat=>{
    html += `<div class="exp-cat" style="background:${CAT_CORES[cat]||'#333'}">${cat}</div>`;
    html += `<div class="exp-head"><div class="cliente">Cliente</div><div class="produto">Produto</div><div class="status">Status</div><div class="volume">Volume a enviar</div></div>`;
    const itensCat = itensAtuais.filter(i=>i.produtos?.categoria===cat);
    let clienteAnterior = null;
    itensCat.forEach(it=>{
      const mostrarCliente = it.clientes?.nome !== clienteAnterior;
      clienteAnterior = it.clientes?.nome;
      html += `<div class="exp-item">
        <div class="cliente">${mostrarCliente ? (it.clientes?.nome||'') : ''}</div>
        <div class="produto">${it.produtos?.nome||''}</div>
        <div class="status"><div class="exp-status" style="background:${STATUS_CORES[it.status]}">${it.status}</div></div>
        <div class="volume">${it.volume ? it.volume+(it.unidade==='cx'?' cx':' unid') : ''}</div>
      </div>`;
    });
  });

  const area = document.getElementById('exportArea');
  area.innerHTML = html;
  await new Promise(r=>setTimeout(r,50));
  const canvas = await html2canvas(area, {backgroundColor:'#fff', scale:2});
  const link = document.createElement('a');
  link.download = `separacao-${separacaoAtual.tipo}-${separacaoAtual.data}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

carregarBase();
</script>
</body>
</html>
